# Describes this module to Backstage (https://backstage.altissimo.io), which
# discovers it hourly. Same shape as altissimo-hq/backstage's catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: terraform-google-organization
  namespace: altissimo
  description: Manages a Google Cloud Organization
  annotations:
    github.com/project-slug: altissimo-hq/terraform-google-organization
    altissimo.io/terraform-registry: altissimo-hq/organization/google
  tags:
    - google
    - organization
    - terraform
    - terraform-modules
  links:
    - url: https://registry.terraform.io/modules/altissimo-hq/organization/google/latest
      title: Terraform Registry
      icon: web
spec:
  type: terraform-module
  lifecycle: production
  owner: group:default/altissimo-agent
  system: altissimo/terraform-modules
  dependsOn:
    - component:altissimo/terraform-google-folders
    - component:altissimo/terraform-google-project
